[global]
# ── Repository ────────────────────────────────────────────────────────────────
# Default: local POSIX repository (Docker volume).
# Production: set repo1-type=s3 and repo1-s3-* env vars, or use
# repo1-type=gcs / azure — pgBackRest supports all three natively.
repo1-path=/var/lib/pgbackrest
repo1-type=posix

# Keep 7 full backups and 7 days of WAL
repo1-retention-full=7
repo1-retention-archive=7
repo1-retention-archive-type=full

# ── Performance ───────────────────────────────────────────────────────────────
start-fast=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[global:archive-push]
compress-level=3

# ── Stanza ────────────────────────────────────────────────────────────────────
[main]
pg1-path=/var/lib/postgresql/data
