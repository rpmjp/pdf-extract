# Promtail configuration — ships container stdout/stderr to a Loki endpoint.
#
# To enable:
#   docker compose --profile logging up -d promtail
#
# Required env var:
#   LOKI_ENDPOINT — e.g. http://loki:3100  or  https://logs.example.com
#
# Labels attached to every log line:
#   job       = "pdf-extract"
#   container = docker container name
#   service   = docker-compose service name (via label)
#
# Log retention is controlled by your Loki server configuration.
# Recommended policy: 30 days hot (indexed, queryable), 1 year cold (object
# storage tier, queryable but slower).  See docs/operations/logging.md.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: "${LOKI_ENDPOINT}/loki/api/v1/push"
    # Retry on transient failures — keeps logs during Loki restarts
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: pdf-extract-containers

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: status
            values: ["running"]

    relabel_configs:
      # Container name → label (strips leading slash)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # docker-compose service name → label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      # Shared job label for all pdf-extract containers
      - target_label: "job"
        replacement: "pdf-extract"

    pipeline_stages:
      # If LOG_FORMAT=json, parse the structured fields for label extraction
      - json:
          expressions:
            level: level
            logger: logger
      - labels:
          level:
          logger:
      # Drop empty lines
      - drop:
          expression: "^\\s*$"
